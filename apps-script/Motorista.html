<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#103F69; --navy-deep:#0B2E4E; --red:#E61A2E; --red-deep:#C2182B;
  --paper:#F1F3F6; --surface:#fff; --ink:#0E2236; --muted:#5C6B78; --line:#D5DCE3;
  --ok:#17733F; --ok-soft:#E2F3E8; --no:#B4161B; --no-soft:#FCE4E4; --warn-soft:#FFF4D6;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.4}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

header{position:sticky;top:0;z-index:5}
.bar{background:#fff;border-bottom:1px solid var(--line)}
.bar .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{height:34px;display:block}
.bar .t{border-left:1px solid var(--line);padding-left:12px;font-weight:600;color:var(--navy);line-height:1.15}
.bar .t small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.band{background:var(--navy);position:relative;overflow:hidden;padding:14px 16px}
.band::before,.band::after{content:"";position:absolute;top:-10px;bottom:-10px;transform:skewX(-32deg)}
.band::before{right:-30px;width:70px;background:var(--red)}
.band::after{right:44px;width:12px;background:rgba(255,255,255,.9)}
.search{max-width:720px;margin:0 auto;position:relative;padding-right:56px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
#q{width:100%;border:0;border-radius:10px;padding:15px 16px 15px 46px;font-size:18px;background:#fff}
#q:focus{outline:none;box-shadow:0 0 0 3px var(--red)}

main{max-width:720px;margin:0 auto;padding:14px 16px 50px}
.msg{text-align:center;color:var(--muted);padding:36px 10px}
.msg b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.count{color:var(--muted);font-size:14px;margin:2px 2px 10px}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.card .head{padding:14px 16px 10px}
.card h2{margin:0;font-size:18px;line-height:1.25}
.card .sub{color:var(--muted);font-size:14px;margin-top:2px}
.prices{display:grid;grid-template-columns:repeat(2,1fr);background:var(--navy);color:#fff}
.prices > div{padding:11px 16px;border-top:1px solid rgba(255,255,255,.12)}
.prices > div:nth-child(odd){border-right:1px solid rgba(255,255,255,.12)}
.prices > div:last-child:nth-child(odd){grid-column:1/-1;border-right:0}
.prices .n{font-size:26px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.prices .u{font-size:13px;opacity:.75}
.noprice{background:var(--warn-soft);padding:12px 16px;font-weight:600;color:#6B4E00}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.fact{border-radius:8px;padding:8px 10px;background:var(--paper)}
.fact .l{font-size:12.5px;color:var(--muted)}
.fact .v{font-weight:700;font-size:16px}
.fact.yes{background:var(--ok-soft)} .fact.yes .v{color:var(--ok)}
.fact.no{background:var(--no-soft)} .fact.no .v{color:var(--no)}
.obs{margin:0 16px 12px;background:var(--warn-soft);border-left:4px solid #E0A400;border-radius:6px;padding:10px 12px;white-space:pre-wrap;font-size:15px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:10px 16px;font-size:13.5px;color:var(--muted)}
.map{color:var(--navy);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.avisos{background:#fff;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:12px;margin-bottom:14px;overflow:hidden}
.avtit{width:100%;border:0;background:none;text-align:left;cursor:pointer;padding:12px 14px;font-weight:700;font-size:16px;color:var(--red-deep);display:flex;align-items:center;gap:8px}
.avico{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:13px}
.avtit .chev{margin-left:auto;color:var(--muted);font-size:12px}
.avisos ol{margin:0;padding:0 16px 12px 34px}
.avisos li{margin-bottom:8px;font-size:15px}
.avisos li::marker{font-weight:700;color:var(--navy)}
.avisos .fin{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#1F8F4E;color:#fff;border-radius:8px;padding:10px 14px;font-weight:700;text-decoration:none}
.wa:hover{background:#18763F}
.tel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:600;color:var(--navy);text-decoration:none}
.cardfin{padding:0 16px 14px}
.cardfin .wa{width:100%}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;margin:0 auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* tela do código */
.pin{max-width:360px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}
.pin h2{margin:0 0 6px;font-size:20px}
.pin p{margin:0 0 14px;color:var(--muted)}
.pin input{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:20px;letter-spacing:2px;text-align:center}
.pin button{width:100%;margin-top:10px;border:0;border-radius:8px;padding:12px;background:var(--red);color:#fff;font-weight:700;font-size:17px;cursor:pointer}
.pin .err{color:var(--no);margin-top:8px;min-height:20px}
@media (max-width:420px){ .bar .t small{display:none} .facts{grid-template-columns:1fr 1fr} }
</style>
</head>

<main id="main"><div class="msg"><div class="spin"></div>Carregando…</div></main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
let PIN = '', MIN = 3, AVISOS = [], FIN = null, avisosOpen = true, seq = 0, timer;

function stored(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }

function call(fn, ...args){
  return new Promise((ok, fail) => {
    /* Se o servidor n\u00e3o responder em 25 s, mostra o motivo em vez de ficar carregando */
    const t = setTimeout(() => fail(new Error('TIMEOUT')), 25000);
    try{
      google.script.run
        .withSuccessHandler(r => { clearTimeout(t); try{ ok(typeof r === 'string' ? JSON.parse(r) : r); }catch(e){ fail(e); } })
        .withFailureHandler(e => { clearTimeout(t); fail(e); })[fn](...args);
    }catch(e){ clearTimeout(t); fail(e); }
  });
}
function showError(e){
  const m = (e && e.message) || String(e);
  const timeout = m === 'TIMEOUT';
  $('main').innerHTML = `<div class="msg"><b>${timeout ? 'O servidor n\u00e3o respondeu' : 'N\u00e3o foi poss\u00edvel abrir a consulta'}</b>
    ${timeout ? 'Confira a internet. Se estiver logado em mais de uma conta Google, abra o link numa aba an\u00f4nima.' : esc(m)}
    <br><br><button id="retry" type="button" style="border:0;border-radius:8px;padding:10px 18px;background:var(--navy);color:#fff;font-weight:700">Tentar de novo</button></div>`;
  var rb = $('retry'); if (rb) rb.addEventListener('click', function(){ location.reload(); });
}
window.addEventListener('error', ev => { if ($('main').textContent.includes('Carregando')) showError(ev.error || ev.message); });

async function start(){
  try{
    const cfg = await call('motoristaConfig');
    MIN = cfg.minChars || 3;
    AVISOS = cfg.avisos || []; FIN = cfg.financeiro || null;
    if (cfg.needPin){
      PIN = stored('los_pin');
      if (!PIN || !(await call('checarPin', PIN)).ok) return showPin();
    }
    ready();
  }catch(e){ showError(e); }
}

function showPin(err){
  $('band').hidden = true;
  $('main').innerHTML = `<form class="pin" id="pinForm">
    <h2>C\u00f3digo de acesso</h2><p>Digite o c\u00f3digo passado pela log\u00edstica. Voc\u00ea s\u00f3 precisa fazer isso uma vez neste celular.</p>
    <input id="pinIn" autocomplete="off" autocapitalize="characters" aria-label="C\u00f3digo de acesso">
    <div class="err">${err ? 'C\u00f3digo incorreto. Confira com a log\u00edstica.' : ''}</div>
    <button type="submit">Entrar</button></form>`;
  $('pinIn').focus();
  $('pinForm').addEventListener('submit', async e => {
    e.preventDefault();
    const v = $('pinIn').value.trim();
    if ((await call('checarPin', v)).ok){ PIN = v; try{ localStorage.setItem('los_pin', v); }catch(e){} ready(); }
    else showPin(true);
  });
}

function ready(){
  $('band').hidden = false;
  idle();
  $('q').focus();
  /* link vindo do WhatsApp com o cliente j\u00e1 pesquisado (\u2026?p=motorista&q=CNPJ) */
  try{
    google.script.url.getLocation(loc => {
      const q = loc && loc.parameter && loc.parameter.q;
      if (q){ $('q').value = q; run(q); }
    });
  }catch(e){}
}
var NL = String.fromCharCode(10);
function waFin(text){
  if (!FIN || !FIN.whatsapp) return '';
  return 'https://wa.me/' + FIN.whatsapp + '?text=' + encodeURIComponent(text);
}
function waLink(href, label, cls){
  return '<a class="wa ' + (cls || '') + '" href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(label) + '</a>';
}

function avisosHtml(){
  if (!AVISOS.length) return '';
  var h = '<div class="avisos" id="avisos">';
  h += '<button type="button" class="avtit" id="avToggle" aria-expanded="' + (avisosOpen ? 'true' : 'false') + '">';
  h += '<span class="avico">!</span> Antes de pagar a descarga <span class="chev">' + (avisosOpen ? '&#9650;' : '&#9660;') + '</span></button>';
  if (avisosOpen){
    h += '<ol>';
    for (var i = 0; i < AVISOS.length; i++) h += '<li>' + esc(AVISOS[i]) + '</li>';
    h += '</ol>';
    if (FIN){
      h += '<div class="fin">';
      if (FIN.whatsapp) h += waLink(waFin('Ol\u00e1 ' + FIN.nome + ', segue informa\u00e7\u00e3o de descarga:'), 'WhatsApp ' + FIN.nome);
      if (FIN.telefone) h += '<a class="tel" href="tel:+' + esc(FIN.whatsapp) + '">Ligar ' + esc(FIN.telefone) + '</a>';
      h += '</div>';
    }
  }
  h += '</div>';
  return h;
}
function bindAvisos(){
  var t = $('avToggle');
  if (!t) return;
  t.addEventListener('click', function(){
    avisosOpen = !avisosOpen;
    var box = $('avisos');
    var tmp = document.createElement('div');
    tmp.innerHTML = avisosHtml();
    box.parentNode.replaceChild(tmp.firstChild, box);
    bindAvisos();
  });
}

function idle(){
  $('main').innerHTML = avisosHtml() + `<div class="msg"><b>Pesquise o cliente</b>Digite o nome (ex.: queiroz) ou o CNPJ, com ou sem pontos.</div>`;
  bindAvisos();
}

$('q').addEventListener('input', () => {
  clearTimeout(timer);
  const q = $('q').value.trim();
  if (norm(q).replace(/\s/g,'').length < MIN){ idle(); return; }
  timer = setTimeout(() => run(q), 350);
});

async function run(q){
  const my = ++seq;
  $('main').innerHTML = `<div class="msg"><div class="spin"></div>Pesquisando\u2026</div>`;
  try{
    const res = await call('buscarMotorista', q, PIN);
    if (my !== seq) return;               /* chegou uma pesquisa mais nova */
    if (res.error === 'pin') return showPin(true);
    render(res);
  }catch(e){
    if (my === seq) $('main').innerHTML = `<div class="msg"><b>Falha na pesquisa</b>Confira a internet e tente de novo.</div>`;
  }
}

const yn = v => { const n = norm(v); return n === 'sim' ? 'yes' : n === 'nao' ? 'no' : ''; };
const ynTxt = v => { const n = norm(v); return n === 'sim' ? 'Sim' : n === 'nao' ? 'N\u00e3o' : (v || 'N\u00e3o informado'); };

function render(res){
  if (!res.results.length){
    $('main').innerHTML = avisosHtml() + `<div class="msg"><b>Nenhum cliente encontrado</b>Confira a grafia ou tente pelo CNPJ. Se n\u00e3o achar, fale com a log\u00edstica.</div>`;
    bindAvisos(); return;
  }
  const more = res.total > res.results.length ? ` (mostrando ${res.results.length}; digite mais para filtrar)` : '';
  $('main').innerHTML = avisosHtml() + `<div class="count">${res.total} cliente${res.total>1?'s':''} encontrado${res.total>1?'s':''}${more}</div>` + res.results.map(card).join('');
  bindAvisos();
}

function finMsg(c, prices){
  var lines = ['*Descarga \u2013 ' + c.razao + '*', 'CNPJ: ' + c.cnpj, [c.bairro, c.cidade].filter(Boolean).join(', '), ''];
  if (prices.length){
    lines.push('Valor cadastrado: ' + prices.map(function(p){ return brl.format(c[p[0]]) + ' ' + p[1]; }).join(' | '));
  } else {
    lines.push('Valor cadastrado: sem valor no app');
  }
  lines.push('', 'Valor pago: R$ ', 'Qtd. de volumes: ', 'Qtd. de ajudantes: ', 'Motorista: ', 'Placa: ');
  return lines.join(NL);
}

function card(c){
  const prices = [
    ['volume','por volume'],['tonelada','por tonelada'],['pallet','por pallet'],['remontado','por pallet remontado']
  ].filter(([k]) => c[k] !== '' && c[k] !== null);
  const place = [c.endereco, c.bairro, c.cidade].filter(Boolean).join(', ');
  const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([c.endereco, c.bairro, c.cidade, 'RN'].filter(Boolean).join(', '));
  const quem = norm(c.quem);
  const fact = (label, value, cls) => `<div class="fact ${cls||''}"><div class="l">${label}</div><div class="v">${esc(value)}</div></div>`;
  return `<article class="card">
    <div class="head"><h2>${esc(c.razao)}</h2><div class="sub">${esc(c.cnpj)}${c.cidade ? ' \u2013 ' + esc([c.bairro, c.cidade].filter(Boolean).join(', ')) : ''}</div></div>
    ${prices.length
      ? `<div class="prices">${prices.map(([k,u]) => `<div><div class="n">${brl.format(c[k])}</div><div class="u">${u}</div></div>`).join('')}</div>`
      : `<div class="noprice">Sem valor de descarga cadastrado. Confirme com a log\u00edstica antes de pagar.</div>`}
    <div class="facts">
      ${c.quem ? fact('Quem descarrega', c.quem, quem.includes('chapa') ? 'yes' : '') : ''}
      ${c.ajudante ? fact('Aceita ajudante?', ynTxt(c.ajudante), yn(c.ajudante)) : ''}
      ${c.escada ? fact('Tem escada?', ynTxt(c.escada), yn(c.escada) === 'yes' ? 'no' : '') : ''}
      ${c.tipo ? fact('Produto', norm(c.tipo).startsWith('frio') ? 'Frios' : 'Seco') : ''}
    </div>
    ${c.obs ? `<div class="obs">${esc(c.obs)}</div>` : ''}
    ${(FIN && FIN.whatsapp) ? '<div class="cardfin">' + waLink(waFin(finMsg(c, prices)), 'Enviar ao financeiro (' + FIN.nome + ')') + '</div>' : ''}
    <div class="foot"><span>${c.atualizado ? 'Atualizado em ' + esc(c.atualizado) : ''}</span>
      ${place ? `<a class="map" href="${maps}" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Abrir no mapa</a>` : ''}
    </div>
  </article>`;
}

start();
</script>
</body>
</html>
